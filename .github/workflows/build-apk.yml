
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4

      - name: Extract and build APK
        run: |
          mkdir source
          unzip -q *.zip -d source
          ROOT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          cd "$(dirname "$ROOT")"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SLAM-BLOCK-AI-APK
          path: source/**/build/outputs/apk/debug/*.apk
